<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>DNA Lab</title>
  <meta name="theme-color" content="#080c12">
  <!-- ESPERIMENTO (branch separato): playground spaziale del DNA con nodi
       fittizi. Non è collegato all'app, non legge né scrive dati. -->
  <link rel="stylesheet" href="../styles.css?v=da87024">
  <link rel="stylesheet" href="dna-lab.css">
</head>
<body class="lab">
  <header class="lab-top">
    <nav class="lab-crumbs" id="labCrumbs" aria-label="Dove sei"></nav>
    <div class="lab-tools">
      <button type="button" class="lab-tool is-on" id="labDepth" aria-pressed="true">Profondità</button>
      <button type="button" class="lab-tool is-on" id="labTilt" aria-pressed="true">Inclinazione</button>
      <button type="button" class="lab-tool" id="labReset">Ricomincia</button>
    </div>
  </header>

  <main class="lab-stage" id="labStage">
    <svg class="lab-edges" id="labEdges" aria-hidden="true"></svg>
    <div class="lab-nodes" id="labNodes"></div>
    <p class="dna-start-hint" id="labHint">Tocca il tuo nodo per aprire i collegamenti</p>
    <span class="lab-fps" id="labFps"></span>
  </main>

  <section class="dna-panel lab-panel" id="labPanel"></section>

  <script type="module" src="dna-lab.js"></script>
</body>
</html>
