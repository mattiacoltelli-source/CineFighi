name: Bump SW version

# Automatizza l'unico passo manuale del sistema di aggiornamento PWA (vedi
# sw.js): ad ogni push "vero" su main, sostituisce SW_VERSION con l'hash
# breve del commit, così il banner "Aggiorna" in app compare sempre, anche
# se ci si dimentica di bumpare il numero a mano (es. modificando app.js
# senza toccare sw.js, o incollando codice a mano senza Claude Code).
#
# Il commit automatico include "[skip ci]" nel messaggio ed è autore
# "github-actions[bot]": entrambi sono controllati nella condizione del job
# qui sotto, così il commit del bot non ri-triggera il workflow all'infinito.
#
# Se due push arrivano ravvicinati, il push del bot sul primo può fallire
# (non è più un fast-forward) — non è un problema: il secondo push ha già
# in corso il proprio bump, aggiornato, quindi il risultato finale resta
# corretto anche se quel singolo run fallisce.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    if: >
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcola l'hash breve del commit
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Aggiorna SW_VERSION in sw.js
        run: sed -i "s/const SW_VERSION = \".*\";/const SW_VERSION = \"${SHORT_SHA}\";/" sw.js

      - name: Commit e push, solo se qualcosa è cambiato
        run: |
          if git diff --quiet -- sw.js; then
            echo "SW_VERSION è già ${SHORT_SHA}, nessun commit necessario."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "chore: bump SW_VERSION a ${SHORT_SHA} [skip ci]"
          git push origin HEAD:main
