name: Guardiano

# Suite di guardia in SOLA LETTURA (vedi playwright.config.ts): carica l'app
# come farebbe una persona qualunque e controlla che regga. Non crea utenti,
# non vota, non scrive niente sul database condiviso del gruppo.
#
# Due lavori diversi perche' rispondono a due domande diverse:
#
#   codice     - ad ogni push: il runner serve QUESTO commit da un server
#                statico locale e lo prova. Verifica la modifica appena
#                fatta, subito, senza aspettare che GitHub Pages abbia
#                pubblicato (altrimenti si proverebbe la versione vecchia).
#
#   sito-vero  - una volta al giorno: prova il sito pubblicato davvero.
#                Serve a sapere se qualcosa si e' rotto DA SOLO — un deploy
#                storto, Supabase giu' — anche in giorni in cui nessuno ha
#                toccato il codice.
#
# Se qualcosa fallisce arriva un messaggio su Telegram. Finche' i due secret
# non esistono, i test girano lo stesso e il passo di notifica viene saltato
# senza far fallire nulla.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"   # ogni mattina alle 7 UTC
  workflow_dispatch:       # per lanciarlo a mano dalla pagina Actions
    inputs:
      prova_telegram:
        description: "Manda solo un messaggio di prova su Telegram (non esegue i test)"
        type: boolean
        default: false

jobs:
  prova-telegram:
    # Un allarme mai provato non è un allarme: questo job manda un messaggio
    # vero, subito, senza aspettare che qualcosa si rompa davvero — la catena
    # intera (secret -> Telegram -> la tua chat) va verificata una volta, non
    # data per buona solo perché i secret esistono. Si avvia solo lanciando
    # il workflow a mano dalla pagina Actions con la spunta attiva.
    if: github.event_name == 'workflow_dispatch' && inputs.prova_telegram
    runs-on: ubuntu-latest
    steps:
      - name: Manda il messaggio di prova
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::error::Mancano i secret TELEGRAM_BOT_TOKEN e/o TELEGRAM_CHAT_ID (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          RISPOSTA=$(curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=CineFighi: messaggio di prova. Se lo leggi, l'allarme funziona.")
          echo "$RISPOSTA"
          echo "$RISPOSTA" | grep -q '"ok":true' || { echo "::error::Telegram ha rifiutato il messaggio: controlla token e chat id."; exit 1; }

  codice:
    # Il commit automatico del bump ("[skip ci]", autore github-actions[bot])
    # non deve far ripartire niente: stesso controllo di bump-version.yml.
    # Anche una prova Telegram non deve far girare i test: e' un job a parte.
    if: (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) && !(github.event_name == 'workflow_dispatch' && inputs.prova_telegram)
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Servi questo commit su una porta locale
        run: |
          python3 -m http.server 8123 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8123/index.html && break
            sleep 1
          done
      - name: Prova il codice appena pushato
        run: npx playwright test
        env:
          CINEFIGHI_URL: http://localhost:8123/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: esito-codice
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Avvisa su Telegram
        if: failure() && env.TG_TOKEN != ''
        run: |
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="CineFighi: l'ultima modifica ha rotto qualcosa (commit ${GITHUB_SHA:0:7}). Dettagli: $RUN"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=$MSG"

  sito-vero:
    # Solo il giro giornaliero e l'avvio manuale: ad ogni push non avrebbe
    # senso, il sito pubblicato e' ancora quello di prima. Una prova Telegram
    # e' un job a parte e non deve far girare anche questo.
    if: github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.prova_telegram)
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Controllo diretto (senza browser), per capire se un 404 è di rete o del browser
        # Il 25/26 settembre 2026 questo job ha fallito piu' volte di fila con
        # il 404 nativo di GitHub Pages ("There isn't a GitHub Pages site
        # here"), mai riprodotto ne' da qui ne' visitando il sito a mano — solo
        # dal runner di Actions. Un curl semplice, nello stesso runner, prima
        # di Playwright: se fallisce anche questo e' un problema di rete di
        # GitHub Actions verso Pages (da segnalare al supporto GitHub); se solo
        # Playwright fallisce, il problema e' nel browser/nella sua rete.
        #
        # Prima riprova (25/9, sera): il curl semplice ha risposto 200 tre
        # volte su tre nello stesso run in cui Playwright falliva ancora — la
        # rete del runner va bene, il problema e' specifico del browser.
        #
        # Seconda riprova (26/9): IPv6 escluso — il runner non ha proprio
        # connettivita' IPv6 (curl -6 fallisce a connettersi, 0ms, nessuna
        # rotta), quindi non puo' essere quello che sceglie Chromium.
        #
        # Sospetto concreto ora: HTTP/2. curl di default usa HTTP/1.1, mentre
        # Chromium negozia sempre HTTP/2 con chi lo supporta (come GitHub
        # Pages/Fastly) — se il bug e' in come Fastly gestisce le richieste
        # HTTP/2 da certe IP, solo il browser lo vedrebbe. --http1.1/--http2
        # isolano i due percorsi.
        run: |
          for i in 1 2 3; do
            curl -sS -o /dev/null -w "tentativo $i (default): HTTP %{http_code}\n" https://mattiacoltelli-source.github.io/CineFighi/
            sleep 3
          done
          curl -4 -sS -o /dev/null -w "IPv4: HTTP %{http_code}\n" https://mattiacoltelli-source.github.io/CineFighi/ || echo "IPv4 fallito"
          curl -6 -sS -o /dev/null -w "IPv6: HTTP %{http_code}\n" https://mattiacoltelli-source.github.io/CineFighi/ || echo "IPv6 non disponibile o fallito su questo runner"
          curl --http1.1 -sS -o /dev/null -w "HTTP/1.1: HTTP %{http_code}\n" https://mattiacoltelli-source.github.io/CineFighi/
          curl --http2 -sS -o /dev/null -w "HTTP/2: HTTP %{http_code}\n" https://mattiacoltelli-source.github.io/CineFighi/
      - name: Controllo con il motore di rete di Playwright (senza browser)
        # Terza riprova (26/9): anche HTTP/2 via curl risponde 200 — non e'
        # nemmeno la versione del protocollo. Tutti i percorsi curl restano
        # puliti; il problema e' specifico del motore vero del browser.
        # Ultimo passo prima di Playwright/Chromium: lo stesso client HTTP di
        # Playwright ("request", niente browser), per capire se il bug e' nel
        # motore di rete di Playwright o solo nel browser vero — e le
        # intestazioni della risposta, per vedere quale nodo/cache di Fastly
        # l'ha servita quando succede.
        run: node scripts/diagnostica-sito.mjs
      - name: Prova il sito pubblicato
        run: npx playwright test
        env:
          CINEFIGHI_URL: https://mattiacoltelli-source.github.io/CineFighi/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: esito-sito-vero
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Avvisa su Telegram
        if: failure() && env.TG_TOKEN != ''
        run: |
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="CineFighi: il sito pubblicato non sta bene (controllo giornaliero). Puo' essere un deploy storto o il backend giu'. Dettagli: $RUN"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=$MSG"
